<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Order System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🛒 Product Order System</h1>

    <p><strong>Enter Product Information</strong></p>

    <div id="products">

        <div class="product">
            <input type="text" class="productName" placeholder="Product Name">
            <input type="number" class="productPrice" placeholder="Price" min="0">
            <input type="number" class="productQuantity" placeholder="Quantity" min="1">
        </div>

    </div>

    <button onclick="addProduct()">+ Add Product</button>
    <button onclick="calculateOrder()">Calculate Order</button>

    <div id="summary" class="summary" style="display:none;">
        <h2>Order Summary</h2>

        <div id="productList"></div>

        <hr>

        <p>Subtotal: ₱<span id="subtotal">0.00</span></p>
        <p>Discount: ₱<span id="discount">0.00</span></p>
        <p>Delivery Fee: ₱<span id="delivery">0.00</span></p>

        <p class="total">
            Total Purchase: ₱<span id="total">0.00</span>
        </p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
