<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Store Checkout System</title>
    <link rel="stylesheet" href="style.css">

    <style>
                * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        h2 {
            text-align: center;
        }

        .field {
            margin: 15px 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 11px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            background: #222;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 12px;
        }

        button:hover {
            background: #444;
        }

        .product {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            background: #fafafa;
        }

        .validation {
            margin-top: 15px;
            padding: 10px;
            color: #b00020;
            font-weight: bold;
        }

        .summary {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }

        .summary-item {
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>MINI STORE CHECKOUT SYSTEM</h1>

        <div class="field">
            <label for="customerName">Customer Name</label>
            <input
                type="text"
                id="customerName"
                placeholder="Enter customer name"
            >
        </div>

        <div class="field">
            <label for="productCount">Number of Products</label>
            <input
                type="number"
                id="productCount"
                min="1"
                step="1"
                placeholder="Enter number of products"
            >
        </div>

        <button type="button" id="generateBtn">
            Generate Product Fields
        </button>

        <div id="productsContainer"></div>

        <div class="field">
            <label for="deliveryOption">Delivery Option</label>

            <select id="deliveryOption">
                <option value="1">Store Pickup</option>
                <option value="2">Standard Delivery</option>
                <option value="3">Express Delivery</option>
            </select>
        </div>

        <button type="button" id="calculateBtn">
            Calculate Order
        </button>

        <div id="validationMessage" class="validation"></div>

        <div
            id="orderSummary"
            class="summary"
            style="display: none;"
        ></div>

    </div>

    <!-- CONNECT JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
